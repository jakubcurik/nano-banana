name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check SKILL.md format, manifests and README links
        run: python -m unittest discover -s tests -p "test_skill_format.py" -v
